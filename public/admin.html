<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex BOT | Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020804;
            --card-bg: #050d08;
            --accent-green: #22c55e;
            --accent-green-glow: rgba(34, 197, 94, 0.25);
            --border-green: rgba(34, 197, 94, 0.15);
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .blur-circle {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.05);
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
        }

        .circle-top { top: -200px; left: 10%; }
        .circle-bottom { bottom: -200px; right: 10%; }

        .container {
            width: 100%;
            max-width: 900px;
            z-index: 10;
        }

        /* Password Modal Styling */
        #loginCard {
            max-width: 400px;
            margin: 100px auto 0 auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-green);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.7), 0 0 35px 2px var(--accent-green-glow);
            text-align: center;
        }

        .header {
            margin-bottom: 35px;
            text-align: center;
        }

        h1 {
            font-weight: 800;
            font-size: 2.2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h1 span {
            color: var(--accent-green);
            text-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 5px;
            font-weight: 600;
        }

        .form-group {
            text-align: left;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 16px;
            background-color: #08160e;
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1.1rem;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            transition: all 0.25s;
        }

        input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 12px 1px rgba(34, 197, 94, 0.3);
        }

        .btn {
            width: 100%;
            background-color: var(--accent-green);
            color: var(--bg-color);
            font-weight: 800;
            font-size: 1rem;
            padding: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }

        .btn:hover {
            background-color: #4ade80;
            box-shadow: 0 4px 25px rgba(34, 197, 94, 0.6);
            transform: translateY(-2px);
        }

        /* Dashboard view */
        #dashboardView {
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-green);
            border-radius: 16px;
            padding: 25px;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 4px; height: 100%;
            background-color: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
        }

        .table-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-green);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.7);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
        }

        .table-title {
            font-weight: 800;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 15px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        td {
            padding: 20px 15px;
            font-size: 1.05rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .phone-num {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-connected {
            background-color: rgba(34, 197, 94, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .status-offline {
            background-color: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .status-pairing {
            background-color: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.2);
            animation: blink 1.5s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }

        .refresh-btn {
            background: transparent;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background-color: var(--accent-green);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--accent-green-glow);
        }

        .footer {
            margin-top: 50px;
            color: #4b5563;
            font-size: 0.75rem;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="blur-circle circle-top"></div>
    <div class="blur-circle circle-bottom"></div>

    <!-- Login View -->
    <div id="loginCard">
        <div class="header">
            <div class="logo" style="font-size: 3rem; margin-bottom: 10px;">🛡️</div>
            <h1>Admin <span>Portal</span></h1>
            <p class="subtitle">Secure Gateway</p>
        </div>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="adminPass">Enter Admin Password</label>
                <input type="password" id="adminPass" placeholder="••••••••••••" required>
            </div>
            <button type="submit" class="btn">Authenticate</button>
        </form>
    </div>

    <!-- Dashboard View -->
    <div class="container" id="dashboardView">
        <div class="header">
            <h1>Flex Bot <span>Control Panel</span></h1>
            <p class="subtitle">Active Session Monitor</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <p class="stat-label">Total Linked Users</p>
                <p class="stat-value" id="statTotal">0</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Online Sessions</p>
                <p class="stat-value" id="statOnline" style="color: var(--accent-green);">0</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">System Uptime</p>
                <p class="stat-value" id="statUptime" style="font-size: 1.6rem; padding-top: 10px;">0h 0m</p>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h3 class="table-title">📱 Registered WhatsApp Bots</h3>
                <button class="refresh-btn" onclick="fetchSessions()">🔄 Refresh</button>
            </div>
            <table id="sessionsTable">
                <thead>
                    <tr>
                        <th>Phone Number</th>
                        <th>Connection Status</th>
                    </tr>
                </thead>
                <tbody id="sessionsList">
                    <tr>
                        <td colspan="2" style="text-align: center; color: var(--text-secondary);">Loading registered sessions...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="footer">
            Admin Console | Restricted Access
        </div>
    </div>

    <script>
        let adminToken = '';
        let backendUrl = '';

        // Dynamically discover backend from Vercel Serverless Function
        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                const data = await res.json();
                if (data.backendUrl) {
                    backendUrl = data.backendUrl;
                }
            } catch (err) {
                console.warn('Config fetch failed, using local/relative origin fallback.');
            }
        }

        function getApiUrl(path) {
            let backend = backendUrl;
            if (backend && backend.endsWith('/')) {
                backend = backend.slice(0, -1);
            }
            return backend ? `${backend}${path}` : path;
        }

        loadConfig();

        async function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('adminPass').value;
            adminToken = pass;
            
            const success = await fetchSessions();
            if (success) {
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('dashboardView').style.display = 'block';
            } else {
                alert('Authentication failed. Invalid Admin Password.');
                adminToken = '';
            }
        }

        async function fetchSessions() {
            try {
                const res = await fetch(getApiUrl('/api/admin/sessions'), {
                    headers: { 'Authorization': adminToken }
                });
                
                if (res.status === 401) return false;
                
                const data = await res.json();
                if (!data.success) return false;

                // Load Stats
                document.getElementById('statTotal').textContent = data.stats.totalUsers;
                document.getElementById('statOnline').textContent = data.stats.onlineUsers;
                
                // Load Uptime
                const uptimeSec = data.stats.serverUptime;
                const hours = Math.floor(uptimeSec / 3600);
                const minutes = Math.floor((uptimeSec % 3600) / 60);
                document.getElementById('statUptime').textContent = `${hours}h ${minutes}m`;

                // Load Sessions List
                const listEl = document.getElementById('sessionsList');
                listEl.innerHTML = '';

                if (data.sessions.length === 0) {
                    listEl.innerHTML = `<tr><td colspan="2" style="text-align: center; color: var(--text-secondary);">No registered users found. Link your first account from the homepage!</td></tr>`;
                } else {
                    data.sessions.forEach(sess => {
                        const tr = document.createElement('tr');
                        
                        let badgeClass = 'status-offline';
                        let badgeText = '🔴 Offline';
                        if (sess.status === 'connected') {
                            badgeClass = 'status-connected';
                            badgeText = '🟢 Online';
                        } else if (sess.status === 'pairing') {
                            badgeClass = 'status-pairing';
                            badgeText = '🟡 Pairing';
                        }

                        tr.innerHTML = `
                            <td class="phone-num">+${sess.phone}</td>
                            <td><span class="status-badge ${badgeClass}">${badgeText}</span></td>
                        `;
                        listEl.appendChild(tr);
                    });
                }

                return true;
            } catch (err) {
                console.error(err);
                return false;
            }
        }
    </script>
</body>
</html>
